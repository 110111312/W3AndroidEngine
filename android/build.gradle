apply plugin: "com.android.application"

android {
    namespace = "com.etheller.warsmash.android"
    compileSdk = 36
    compileSdkMinor = 1
    buildToolsVersion = "36.1.0"

    sourceSets {
        main {
            manifest.srcFile("AndroidManifest.xml")
            java.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["assets", "build/generated/engineAssets"]
            jniLibs.srcDirs = ["libs"]
        }
        debug {
            java.srcDirs = ["src-debug"]
            manifest.srcFile("src-debug/AndroidManifest.xml")
        }
    }

    defaultConfig {
        applicationId = "com.etheller.warsmash.android"
        minSdk = 26
        targetSdk = 36
        versionCode = 3156
        versionName = "0.3.156"
    }

    // Release signing is read from a properties file kept outside the repository; without it the release APK stays unsigned.
    def signingFile = file(System.getenv("WARSMASH_SIGNING") ?: "${System.getProperty("user.home")}/.warsmash/release-signing.properties")
    if (signingFile.isFile()) {
        def signing = new Properties()
        signingFile.withInputStream { signing.load(it) }
        signingConfigs {
            release {
                storeFile = file(signing.getProperty("storeFile"))
                storePassword = signing.getProperty("storePassword")
                keyAlias = signing.getProperty("keyAlias")
                keyPassword = signing.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            if (signingFile.isFile()) {
                signingConfig = signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/LICENSE*", "META-INF/NOTICE*", "META-INF/DEPENDENCIES"]
        }
    }
}

configurations {
    natives
}

dependencies {
    implementation project(":core")
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    for (abi in ["armeabi-v7a", "arm64-v8a", "x86_64"]) {
        natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$abi"
        natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-$abi"
    }
}

// The natives come as jars per ABI; unpack them into the jniLibs folder.
tasks.register("copyAndroidNatives") {
    doFirst {
        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn "copyAndroidNatives"
}

// Ability builder definitions are read as internal files, so they ship inside the APK. The engine's own UI
// resources ship too and are unpacked by the launcher, because the engine reads them from a folder.
tasks.register("copyAbilityBehaviors", Sync) {
    from("../core/assets/abilityBehaviors") { into "abilityBehaviors" }
    from("../core/assets/abilityBehaviors_compatibility") { into "abilityBehaviors_compatibility" }
    from("../resources") { into "engineResources" }
    into "build/generated/engineAssets"
}

tasks.named("preBuild") { dependsOn "copyAbilityBehaviors" }

// The game files are not in the repository: the app reads them from its own folder on the device, so this task copies
// a local copy of the game folder there, once per device. -PgameDataDir=<folder> points at another copy.
def gameDataDir = file(findProperty("gameDataDir") ?: "${rootProject.projectDir}/wc3/Files_1.29.2/Warcraft III")
def adbExecutable = {
    def sdk = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
            ?: "${System.getProperty("user.home")}/AppData/Local/Android/Sdk"
    def adb = new File(sdk, "platform-tools/adb.exe")
    return adb.isFile() ? adb.absolutePath : new File(sdk, "platform-tools/adb").absolutePath
}

tasks.register("pushGameData", Exec) {
    description = "Copies the game files into the app's own folder on the connected device."
    group = "install"
    doFirst {
        if (!gameDataDir.isDirectory()) {
            throw new GradleException("No game files in ${gameDataDir}; set -PgameDataDir=<folder>.")
        }
        logger.lifecycle("Copying ${gameDataDir} to the device; the first copy takes a while.")
    }
    commandLine adbExecutable(), "push", "${gameDataDir.absolutePath}/.",
            "/sdcard/Android/data/${android.defaultConfig.applicationId}/files/data/"
}

// The folder has to exist before the copy, and only an installed app has it.
tasks.register("installWithGameData") {
    description = "Installs the debug APK and copies the game files to the device."
    group = "install"
    dependsOn "installDebug"
    dependsOn "pushGameData"
}
tasks.named("pushGameData") { mustRunAfter "installDebug" }
